# =============================================================================
# MODELO DE CADASTRO DE CLIENTES MONITORADOS (TEMPLATE EM BRANCO)
# =============================================================================
# Copie este bloco para cada nova empresa cliente que o escritório for monitorar.
# Adicione quantos clientes desejar. O sistema segrega 100% os dados de cada um.

clients:
  - id: "codigo-unico-cliente-1"               # Identificador único (letras minúsculas e hífen, sem espaços)
    name: "Razão Social ou Nome Fantasia da Empresa" # Nome oficial que aparecerá nos alertas
    cnpj: "00.000.000/0001-00"                  # CNPJ do cliente
    
    # Aliases de E-mail:
    # São os e-mails ou apelidos que redirecionam para a caixa central do seu escritório.
    # Ex: se o seu domínio for @escritorio.adv.br, crie apelidos como cliente1@escritorio.adv.br
    aliases:
      - "cliente1@seu-escritorio.com.br"
      - "fiscal.cliente1@seu-escritorio.com.br"
      - "juridico.cliente1@seu-escritorio.com.br"

    # Destinatários dos Alertas:
    destinatarios:
      advogados:
        - nome: "Dr(a). Nome do Advogado Responsável"
          whatsapp: "5561999990001"              # Formato internacional (DDI 55 + DDD + Telefone sem traços ou espaços)
          notificar_em: ["todos"]                # ["todos"] ou especificar: ["judicial", "dje", "trf", "tj", "pgfn", "trabalhista"]
      contadores:
        - nome: "Nome do Contador ou Escritório de Contabilidade"
          whatsapp: "5561999990002"              # Formato internacional (DDI 55 + DDD + Telefone)
          notificar_em: ["todos"]                # ["todos"] ou especificar: ["receita_geral", "dte", "sefaz", "prefeitura", "iss"]

    # Configurações Específicas do Cliente:
    configuracoes:
      urgencia_minima_whatsapp: "media"          # baixa, media, alta ou critica
      enviar_pdf_anexo: true                     # true para anexar o PDF da intimação junto com a mensagem
